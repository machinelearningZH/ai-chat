description:
  en:
    localisedName: Local AI Chat
    shortDescription: An AI chat app you can host yourself, with support for
      document uploads.
    longDescription: >
      Local AI Chat lets you ask questions, draft text, and work with documents.
      Attach a PDF, Word document, spreadsheet, presentation, or text file to ask
      questions about it, summarize it, or find specific information.

      The app sends chat and extracted document text to the model server you
      configure. You can run both on your own infrastructure with Ollama, vLLM,
      or llama.cpp. You can change the models, prompts, and interface language.
      An optional local usage report shows aggregate chat activity, response
      timings, and document import outcomes.
    documentation: https://github.com/machinelearningZH/ai-chat/blob/main/README.md
    features:
      - Chat with a model you host
      - Ask questions about uploaded documents
      - Choose models and change prompts
      - View local usage totals
