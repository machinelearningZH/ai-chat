name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_CONTEXT_LENGTH: "100000"

jobs:
  quality:
    name: Quality and container smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.23"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.13.14

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Validate Compose configurations
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
          docker compose -f compose.yaml -f compose.amd.yaml config --quiet

      - name: Build image
        run: docker build --tag ai-chat:ci .

      - name: Start container
        run: docker run --detach --name ai-chat-ci ai-chat:ci

      - name: Wait for healthy container
        run: |
          for attempt in {1..24}; do
            health="$(docker inspect --format '{{.State.Health.Status}}' ai-chat-ci)"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              docker logs ai-chat-ci
              exit 1
            fi
            sleep 5
          done

          docker logs ai-chat-ci
          echo "Container did not become healthy in time" >&2
          exit 1

      - name: Clean up container
        if: always()
        run: docker rm --force ai-chat-ci 2>/dev/null || true
